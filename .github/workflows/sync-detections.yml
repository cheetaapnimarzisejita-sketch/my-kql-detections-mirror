name: Replicate KQL Queries

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every single night at midnight
  workflow_dispatch: # Allows you to manually click "Run workflow" inside GitHub UI

jobs:
  replicate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Network Requests Library
        run: pip install requests

      - name: Execute Replication Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Seamless secure token injection
        run: python sync_kql.py


      - name: Commit and Push to My Branch
        run: |
          git config --global user.name "KQL-Mirror-Bot"
          git config --global user.email "actions@github.com"
          git add KQL/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated replication of KQL database rules" && git push origin main)
