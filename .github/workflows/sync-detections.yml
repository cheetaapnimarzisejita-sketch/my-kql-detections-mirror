name: Replicate KQL Queries

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every single night at midnight
  workflow_dispatch: # Allows you to manually click "Run workflow" inside GitHub UI

jobs:
  replicate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Network Requests Library
        run: pip install requests

      - name: Execute Replication Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Seamless secure token injection
        run: python sync_kql.py


      - name: Commit and Push New Detections
        run: |
          git config --global user.name "Detection-Sync-Bot"
          git config --global user.email "actions@github.com"
          
          # Force Git to track everything inside the new directory
          git add KQL/
          
          # Output local directory logs to the GitHub Action screen for debugging
          echo "=== Verification Check ==="
          ls -la KQL/ || echo "Directory empty!"
          
          # Force a commit execution bypass if git diff is acting blind
          git commit -m "Automated KQL replication database payload" || echo "No tracked updates detected."
          
          # Force branch sync execution directly up to your main repository branch
          git push origin main
